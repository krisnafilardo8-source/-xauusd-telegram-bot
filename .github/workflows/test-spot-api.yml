
name: Test Spot Gold API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Test live spot price
        env:
          METALCHARTS_API_KEY: ${{ secrets.METALCHARTS_API_KEY }}
        run: python test_spot_api.py
